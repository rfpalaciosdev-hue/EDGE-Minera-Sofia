name: Diagnostico Edge (solo lectura)

on:
  push:
    branches: [main]
    paths:
      - 'scripts/diagnostics/**'
      - '.github/workflows/diagnose-edge.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edge-diagnostics
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: self-hosted
    environment: Minera-Sofia
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          clean: false
      - name: Leer estado y conexion del agente sin reiniciar servicios
        shell: powershell
        run: ./scripts/diagnostics/Read-EdgeDiagnostics.ps1 -ExpectedSite LINEA_1 -ExpectedTenant minera-sofia
