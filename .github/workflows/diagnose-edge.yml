name: Diagnostico Edge (solo lectura)

on:
  push:
    branches: [main]
    paths:
      - 'scripts/diagnostics/**'
      - '.github/workflows/diagnose-edge.yml'
  workflow_dispatch:
  workflow_run:
    workflows: ['Deploy Edge Agent']
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: edge-diagnostics
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: self-hosted
    environment: Minera-Sofia
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          clean: false
      - name: Leer estado y conexion del agente sin reiniciar servicios
        shell: powershell
        run: |
          ./tests/windows/Test-EdgeDiagnosticSummary.ps1
          ./scripts/diagnostics/Read-EdgeDiagnostics.ps1 -ExpectedSite LINEA_1 -ExpectedTenant minera-sofia
